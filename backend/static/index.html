<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevKit AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }

        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            top: -10px;
            width: 2px;
            height: 15px;
            background: linear-gradient(to bottom, rgba(74, 144, 217, 0), rgba(74, 144, 217, 0.6));
            animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(100vh); opacity: 0.8; } }

        .app {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(8px);
            max-width: 450px;
            width: 100%;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(74, 144, 217, 0.15);
            border: 1px solid rgba(74, 144, 217, 0.15);
            position: relative;
            z-index: 1;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 { font-size: 32px; color: #4A90D9; text-align: center; margin-bottom: 5px; text-shadow: 0 0 30px rgba(74, 144, 217, 0.15); }
        .sub { color: #6a8db5; text-align: center; margin-bottom: 25px; font-size: 16px; }
        input, select {
            width: 100%;
            padding: 15px;
            border: 1px solid #1a2a4a;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            background: rgba(20, 30, 60, 0.6);
            color: #aac8ff;
            transition: border 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #4A90D9; box-shadow: 0 0 20px rgba(74, 144, 217, 0.1); }
        input::placeholder { color: #4a6a8a; }
        button {
            width: 100%;
            padding: 16px;
            background: #4A90D9;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(74, 144, 217, 0.15);
            margin-top: 5px;
        }
        button:hover { background: #5a9fe9; box-shadow: 0 0 40px rgba(74, 144, 217, 0.25); transform: scale(1.02); }
        button:disabled { opacity: 0.6; pointer-events: none; }
        .btn-secondary { background: #2a3a5a; }
        .btn-secondary:hover { background: #3a4a6a; }
        .btn-danger { background: #E74C3C; }
        .btn-danger:hover { background: #ff5a4a; }
        .btn-green { background: #34A853; }
        .btn-green:hover { background: #4cba6a; }
        .btn-orange { background: #F9AB00; }
        .btn-orange:hover { background: #fabc2a; }
        .btn-purple { background: #8e44ad; }
        .btn-purple:hover { background: #a569bd; }
        .btn-sm { font-size: 14px; padding: 10px; margin-top: 8px; }

        .switch { text-align: center; margin-top: 15px; color: #4a6a8a; font-size: 14px; }
        .switch a { color: #4A90D9; font-weight: bold; text-decoration: none; }
        .switch a:hover { color: #6aafe9; text-decoration: underline; }
        .hidden { display: none; }

        .card {
            background: rgba(20, 30, 60, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid rgba(74, 144, 217, 0.1);
        }
        .card textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #1a2a4a;
            border-radius: 8px;
            font-size: 14px;
            min-height: 100px;
            font-family: monospace;
            background: rgba(10, 14, 26, 0.6);
            color: #aac8ff;
        }
        .card textarea:focus { outline: none; border-color: #4A90D9; }
        .card textarea::placeholder { color: #4a6a8a; }
        
        .result {
            background: rgba(20, 30, 60, 0.6);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            color: #aac8ff;
            border: 1px solid rgba(74, 144, 217, 0.1);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-input-label {
            display: block;
            padding: 12px;
            background: rgba(20, 30, 60, 0.6);
            border: 1px dashed #4A90D9;
            border-radius: 12px;
            color: #6a8db5;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .file-input-label:hover {
            border-color: #5a9fe9;
            background: rgba(30, 50, 90, 0.6);
        }
        .file-input-label .filename {
            color: #aac8ff;
            font-weight: bold;
        }

        .history-item {
            background: rgba(10, 14, 26, 0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #4A90D9;
        }
        .history-item .lang { color: #6a8db5; font-size: 12px; text-transform: uppercase; }
        .history-item .code-snippet { color: #aac8ff; font-family: monospace; font-size: 13px; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .feedback-preview { color: #8ab4f8; font-size: 13px; }
        .history-item .date { color: #4a6a8a; font-size: 11px; float: right; }
        .history-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            flex: 1;
        }
        .history-btn.re-review { background: #4A90D9; color: white; }
        .history-btn.re-review:hover { background: #5a9fe9; }
        .history-btn.delete-btn { background: #E74C3C; color: white; }
        .history-btn.delete-btn:hover { background: #ff5a4a; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }

        .flashcard-item {
            background: rgba(10, 14, 26, 0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #34A853;
        }
        .flashcard-item .q { color: #aac8ff; font-weight: bold; }
        .flashcard-item .a { color: #8ab4f8; margin-top: 4px; }

        .divider {
            text-align: center;
            color: #4a6a8a;
            font-size: 12px;
            margin: 12px 0;
            border-top: 1px solid #1a2a4a;
            padding-top: 12px;
        }
        .divider span { background: #0a0e1a; padding: 0 10px; }

        /* Animation Overlay */
        .animation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            pointer-events: none;
            background: #0a0e1a;
        }
        .character { font-size: 120px; line-height: 1; text-align: center; filter: drop-shadow(0 0 40px rgba(74, 144, 217, 0.5)); animation: characterSequence 6s ease-in-out forwards; }
        .eyes { display: inline-block; animation: blink 1.5s ease-in-out 3; }
        @keyframes blink { 0%, 100% { transform: scaleY(1); opacity: 1; } 48% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(0.1); opacity: 0.5; } 52% { transform: scaleY(1); opacity: 1; } }
        @keyframes characterSequence { 0% { opacity: 0; transform: scale(0.5) rotate(-10deg); } 15% { opacity: 1; transform: scale(1) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(0deg); } 70% { opacity: 0; transform: scale(0.8) rotate(10deg); } 100% { opacity: 0; transform: scale(0.5) rotate(20deg); display: none; } }
        .typewriter-container { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; animation: fadeInTypewriter 1s ease 4.5s forwards; }
        @keyframes fadeInTypewriter { 0% { opacity: 0; } 100% { opacity: 1; } }
        .typewriter-text { font-size: 36px; font-weight: bold; color: #4A90D9; text-shadow: 0 0 20px rgba(74, 144, 217, 0.3), 0 0 60px rgba(74, 144, 217, 0.1); letter-spacing: 2px; display: inline-block; overflow: hidden; white-space: nowrap; border-right: 3px solid #4A90D9; animation: typewriter 2.5s steps(18) 1s forwards, blinkCursor 0.8s step-end 3; width: 0; }
        @keyframes typewriter { from { width: 0; } to { width: 100%; } }
        @keyframes blinkCursor { 0%, 100% { border-color: #4A90D9; } 50% { border-color: transparent; } }
        .animation-overlay.hidden { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        @media (max-width: 450px) { .character { font-size: 80px; } .typewriter-text { font-size: 24px; } }
    </style>
</head>
<body>

    <!-- Animation Overlay -->
    <div class="animation-overlay" id="animationOverlay">
        <div class="character" id="character"><span class="eyes">👀</span></div>
        <div class="typewriter-container"><div class="typewriter-text">✨ Welcome to DevKit AI ✨</div></div>
    </div>

    <!-- Rain -->
    <div class="rain" id="rainContainer"></div>

    <!-- Main App -->
    <div class="app" id="app">
        <!-- Auth -->
        <div id="authSection">
            <h1>DevKit AI</h1>
            <p class="sub" id="authTitle">Welcome Back</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="submitBtn">Login</button>
            <p class="switch"><span id="toggleText">Don't have an account?</span> <a href="#" id="toggleLink">Sign Up</a></p>
        </div>

        <!-- Dashboard -->
        <div id="dashSection" class="hidden">
            <h1>DevKit AI</h1>
            <p class="sub">Choose your tool</p>
            
            <!-- 1. CODE REVIEWER - TYPE OR UPLOAD -->
            <div class="card">
                <strong style="color:#4A90D9;">🤖 Code Reviewer</strong>
                <textarea id="codeInput" placeholder="Or type/paste your code here..."></textarea>
                <input type="text" id="langInput" placeholder="Language (python, javascript)" value="python">
                <button id="reviewBtn">Review Code</button>
                
                <div class="divider"><span>OR</span></div>
                
                <div class="file-input-wrapper">
                    <input type="file" id="codeFileInput" accept=".py,.js,.ts,.java,.c,.cpp,.cs,.go,.rs,.rb,.php,.html,.css,.json,.txt">
                    <label class="file-input-label" id="codeFileLabel">📂 Upload a code file... <span class="filename" id="codeFileName"></span></label>
                </div>
                <button id="reviewFileBtn" class="btn-sm">Review File</button>
                <div id="reviewResult" class="result hidden"></div>
            </div>

            <!-- 2. STUDY BUDDY - TYPE OR UPLOAD -->
            <div class="card">
                <strong style="color:#34A853;">📚 Study Buddy</strong>
                <textarea id="notesInput" placeholder="Or type/paste your notes here..."></textarea>
                <input type="number" id="numCardsInput" placeholder="Number of flashcards" value="3">
                <button id="flashcardBtn">Generate Flashcards</button>
                
                <div class="divider"><span>OR</span></div>
                
                <div class="file-input-wrapper">
                    <input type="file" id="flashcardFileInput" accept=".pdf,.docx">
                    <label class="file-input-label" id="flashcardFileLabel">📂 Upload PDF or Word... <span class="filename" id="flashcardFileName"></span></label>
                </div>
                <button id="flashcardFileBtn" class="btn-sm btn-green">Generate from File</button>
                <div id="flashcardResult" class="result hidden"></div>
                <button id="downloadPdfBtn" class="btn-purple hidden">📥 Download PDF</button>
            </div>

            <!-- History -->
            <button id="historyToggleBtn" class="btn-secondary" style="margin-top:15px;">📜 Show History</button>
            <div id="historyContainer" class="hidden" style="margin-top:15px;">
                <div id="historyList"></div>
            </div>

            <button class="btn-danger" id="logoutBtn" style="margin-top:20px;">Logout</button>
        </div>
    </div>

    <script>
        // --- RAIN ---
        const rainContainer = document.getElementById('rainContainer');
        for (let i = 0; i < 80; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = Math.random() * 100 + '%';
            drop.style.width = (Math.random() * 1.5 + 1) + 'px';
            drop.style.height = (Math.random() * 12 + 6) + 'px';
            drop.style.opacity = Math.random() * 0.5 + 0.3;
            drop.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            drop.style.animationDelay = (Math.random() * 3) + 's';
            rainContainer.appendChild(drop);
        }

        setTimeout(() => {
            document.getElementById('animationOverlay').classList.add('hidden');
        }, 8000);

        // --- APP LOGIC ---
        const API = window.location.origin;
        let token = null;
        let isLogin = true;
        let currentFlashcards = [];

        // DOM refs
        const authSection = document.getElementById('authSection');
        const dashSection = document.getElementById('dashSection');
        const authTitle = document.getElementById('authTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const logoutBtn = document.getElementById('logoutBtn');
        const historyToggleBtn = document.getElementById('historyToggleBtn');
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');

        // Code Reviewer
        const codeInput = document.getElementById('codeInput');
        const langInput = document.getElementById('langInput');
        const reviewBtn = document.getElementById('reviewBtn');
        const reviewResult = document.getElementById('reviewResult');
        const codeFileInput = document.getElementById('codeFileInput');
        const codeFileLabel = document.getElementById('codeFileLabel');
        const codeFileName = document.getElementById('codeFileName');
        const reviewFileBtn = document.getElementById('reviewFileBtn');

        // Study Buddy
        const notesInput = document.getElementById('notesInput');
        const numCardsInput = document.getElementById('numCardsInput');
        const flashcardBtn = document.getElementById('flashcardBtn');
        const flashcardResult = document.getElementById('flashcardResult');
        const flashcardFileInput = document.getElementById('flashcardFileInput');
        const flashcardFileLabel = document.getElementById('flashcardFileLabel');
        const flashcardFileName = document.getElementById('flashcardFileName');
        const flashcardFileBtn = document.getElementById('flashcardFileBtn');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');

        // --- AUTH ---
        function showAuth() { authSection.classList.remove('hidden'); dashSection.classList.add('hidden'); }
        function showDash() { authSection.classList.add('hidden'); dashSection.classList.remove('hidden'); }
        function setLoading(btn, loading, text) {
            if (loading) { btn.textContent = 'Please wait...'; btn.disabled = true; } 
            else { btn.textContent = text || 'Submit'; btn.disabled = false; }
        }

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            authTitle.textContent = isLogin ? 'Welcome Back' : 'Create Account';
            submitBtn.textContent = isLogin ? 'Login' : 'Sign Up';
            toggleText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            toggleLink.textContent = isLogin ? 'Sign Up' : 'Login';
            email.value = ''; password.value = '';
        });

        submitBtn.addEventListener('click', async () => {
            const e = email.value.trim(), p = password.value.trim();
            if (!e || !p) return alert('Please fill in all fields');
            setLoading(submitBtn, true);
            try {
                const endpoint = isLogin ? '/login' : '/signup';
                const res = await fetch(API + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: e, password: p })
                });
                const data = await res.json();
                if (data.access_token) {
                    token = data.access_token;
                    showDash();
                } else if (data.id) {
                    alert('Account created! Please login.');
                    isLogin = true;
                    authTitle.textContent = 'Welcome Back';
                    submitBtn.textContent = 'Login';
                    toggleText.textContent = "Don't have an account?";
                    toggleLink.textContent = 'Sign Up';
                    password.value = '';
                } else {
                    alert(isLogin ? 'Invalid credentials' : 'Email already exists');
                }
            } catch (err) { alert('Server error. Make sure backend is running.'); }
            setLoading(submitBtn, false, isLogin ? 'Login' : 'Sign Up');
        });

        logoutBtn.addEventListener('click', () => { token = null; showAuth(); 
            reviewResult.classList.add('hidden'); flashcardResult.classList.add('hidden');
            historyContainer.classList.add('hidden'); historyToggleBtn.textContent = '📜 Show History'; 
            currentFlashcards = []; downloadPdfBtn.classList.add('hidden'); });

        // --- FILE INPUT LABEL UPDATES ---
        codeFileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                codeFileName.textContent = this.files[0].name;
                codeFileLabel.style.borderColor = '#4A90D9';
            }
        });

        flashcardFileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                flashcardFileName.textContent = this.files[0].name;
                flashcardFileLabel.style.borderColor = '#34A853';
            }
        });

        // --- 1. CODE REVIEWER - TYPE ---
        reviewBtn.addEventListener('click', async () => {
            const code = codeInput.value.trim();
            const lang = langInput.value.trim() || 'python';
            if (!code) return alert('Please paste some code or use the file upload.');
            setLoading(reviewBtn, true, 'Reviewing...');
            reviewResult.classList.add('hidden');
            try {
                const res = await fetch(API + '/review-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ code, language: lang })
                });
                const data = await res.json();
                if (data.feedback) {
                    reviewResult.textContent = data.feedback;
                    reviewResult.classList.remove('hidden');
                    if (!historyContainer.classList.contains('hidden')) fetchHistory();
                } else { alert('AI Error: ' + (data.detail || 'Unknown error')); }
            } catch (err) { alert('Network error'); }
            setLoading(reviewBtn, false, 'Review Code');
        });

        // --- 1. CODE REVIEWER - UPLOAD ---
        reviewFileBtn.addEventListener('click', async () => {
            const file = codeFileInput.files[0];
            if (!file) return alert('Please select a code file.');
            const formData = new FormData();
            formData.append('file', file);
            setLoading(reviewFileBtn, true, 'Reviewing...');
            reviewResult.classList.add('hidden');
            try {
                const res = await fetch(API + '/review-file', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (data.feedback) {
                    reviewResult.textContent = `📝 Language: ${data.language}\n\n${data.feedback}`;
                    reviewResult.classList.remove('hidden');
                    if (!historyContainer.classList.contains('hidden')) fetchHistory();
                } else { alert('Error: ' + (data.detail || 'Unknown error')); }
            } catch (err) { alert('Network error'); }
            setLoading(reviewFileBtn, false, 'Review File');
        });

        // --- 2. STUDY BUDDY - TYPE ---
        flashcardBtn.addEventListener('click', async () => {
            const notes = notesInput.value.trim();
            const num = parseInt(numCardsInput.value) || 3;
            if (!notes) return alert('Please paste your notes or upload a file.');
            setLoading(flashcardBtn, true, 'Generating...');
            flashcardResult.classList.add('hidden');
            downloadPdfBtn.classList.add('hidden');
            try {
                const res = await fetch(API + '/generate-flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ notes, num_cards: num })
                });
                const data = await res.json();
                if (data.flashcards && data.flashcards.length > 0) {
                    currentFlashcards = data.flashcards;
                    let display = currentFlashcards.map(c => 
                        `<div class="flashcard-item"><div class="q">❓ ${c.front}</div><div class="a">✅ ${c.back}</div></div>`
                    ).join('');
                    flashcardResult.innerHTML = display;
                    flashcardResult.classList.remove('hidden');
                    downloadPdfBtn.classList.remove('hidden');
                } else { alert('Could not generate flashcards.'); }
            } catch (err) { alert('Network error'); }
            setLoading(flashcardBtn, false, 'Generate Flashcards');
        });

        // --- 2. STUDY BUDDY - UPLOAD ---
        flashcardFileBtn.addEventListener('click', async () => {
            const file = flashcardFileInput.files[0];
            if (!file) return alert('Please upload a PDF or Word file.');
            const numCards = parseInt(numCardsInput.value) || 3;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('num_cards', numCards);
            setLoading(flashcardFileBtn, true, 'Generating...');
            flashcardResult.classList.add('hidden');
            downloadPdfBtn.classList.add('hidden');
            try {
                const res = await fetch(API + '/flashcard-file?num_cards=' + numCards, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                if (data.flashcards && data.flashcards.length > 0) {
                    currentFlashcards = data.flashcards;
                    let display = currentFlashcards.map(c => 
                        `<div class="flashcard-item"><div class="q">❓ ${c.front}</div><div class="a">✅ ${c.back}</div></div>`
                    ).join('');
                    flashcardResult.innerHTML = display;
                    flashcardResult.classList.remove('hidden');
                    downloadPdfBtn.classList.remove('hidden');
                } else { alert('Could not generate flashcards.'); }
            } catch (err) { alert('Network error'); }
            setLoading(flashcardFileBtn, false, 'Generate from File');
        });

        // --- 3. DOWNLOAD FLASHCARDS AS PDF ---
        downloadPdfBtn.addEventListener('click', async () => {
            if (!currentFlashcards || currentFlashcards.length === 0) return alert('No flashcards to download.');
            downloadPdfBtn.textContent = 'Generating PDF...';
            downloadPdfBtn.disabled = true;
            try {
                const res = await fetch(API + '/download-flashcards-pdf', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ flashcards: currentFlashcards })
                });
                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'flashcards.pdf';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } else { alert('Failed to download PDF.'); }
            } catch (err) { alert('Network error'); }
            downloadPdfBtn.textContent = '📥 Download PDF';
            downloadPdfBtn.disabled = false;
        });

        // --- HISTORY ---
        historyToggleBtn.addEventListener('click', () => {
            if (historyContainer.classList.contains('hidden')) {
                historyContainer.classList.remove('hidden');
                historyToggleBtn.textContent = '📜 Hide History';
                fetchHistory();
            } else {
                historyContainer.classList.add('hidden');
                historyToggleBtn.textContent = '📜 Show History';
            }
        });

        window.reReview = function(button) {
            const item = button.closest('.history-item');
            const code = decodeURIComponent(item.dataset.code);
            codeInput.value = code;
            document.querySelector('.app').scrollTop = 0;
            reviewBtn.click();
        };

        window.deleteHistory = async function(button) {
            const item = button.closest('.history-item');
            const id = item.dataset.id;
            if (!confirm('Delete this review?')) return;
            try {
                const res = await fetch(API + '/history/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    item.remove();
                    if (historyList.children.length === 0) {
                        historyList.innerHTML = '<div style="color: #6a8db5; text-align:center; padding: 15px;">No reviews yet. Review some code!</div>';
                    }
                } else { alert('Failed to delete.'); }
            } catch (err) { alert('Network error.'); }
        };

        async function fetchHistory() {
            historyList.innerHTML = '<div style="color: #6a8db5; text-align:center;">Loading history...</div>';
            try {
                const res = await fetch(API + '/history', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data.length === 0) {
                    historyList.innerHTML = '<div style="color: #6a8db5; text-align:center; padding: 15px;">No reviews yet. Review some code!</div>';
                    return;
                }
                let html = '';
                data.forEach(item => {
                    const safeCode = encodeURIComponent(item.code);
                    html += `
                        <div class="history-item" data-id="${item.id}" data-code="${safeCode}" data-lang="${item.language}">
                            <span class="lang">${item.language}</span>
                            <span class="date">${item.created_at}</span>
                            <div class="code-snippet">${item.code.substring(0, 50)}${item.code.length > 50 ? '...' : ''}</div>
                            <div class="feedback-preview">💬 ${item.feedback}</div>
                            <div class="btn-group">
                                <button class="history-btn re-review" onclick="reReview(this)">↻ Re-review</button>
                                <button class="history-btn delete-btn" onclick="deleteHistory(this)">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                });
                historyList.innerHTML = html;
            } catch (err) {
                historyList.innerHTML = '<div style="color: #E74C3C; text-align:center;">Failed to load history.</div>';
            }
        }

        showAuth();
    </script>
</body>
</html>
